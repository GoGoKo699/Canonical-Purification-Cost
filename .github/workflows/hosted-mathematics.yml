name: Hosted mathematics

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA to inspect (empty uses the workflow revision)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || inputs.revision || github.sha }}
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the pinned comparison tools
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import urllib.request

          revision = os.environ["SOURCE_REVISION"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("SOURCE_REVISION must be a full commit SHA")
          root = Path(os.environ["RUNNER_TEMP"]) / "cpc-math-tools"
          root.mkdir()
          base = "https://raw.githubusercontent.com/GoGoKo699/Guinevere/77aeec34075571288b970d4007c65929a12d4f07/plugins/merlin-arthur-research/skills/merlin-arthur-research/scripts/"
          expected = {
              "capture_hosted_math.cjs": "49182eaf354e86f685a4976814d672de5d7329a2d9e42f62a5227e2bc07c2d18",
              "check_rendered_math.py": "edbc2d72af94e96b78166d74b66fcea150134f2f3ebaaea121e9057768e1dbfe",
              "check_completion.py": "4b49f4235fdec2666a66f6dd474cbacfd6e571a5211a265b1cd0d3d404868ddf",
          }
          for name, digest in expected.items():
              with urllib.request.urlopen(base + name, timeout=30) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit("Tool digest mismatch: " + name)
              (root / name).write_bytes(data)
          PY

      - name: Install the browser dependencies
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/cpc-math-deps" --no-audit --no-fund playwright@1.56.1 mathjax-full@3.2.1
          node "$RUNNER_TEMP/cpc-math-deps/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Compare the hosted pages with their source
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/cpc-math-deps/node_modules
        run: |
          node "$RUNNER_TEMP/cpc-math-tools/capture_hosted_math.cjs" \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$SOURCE_REVISION" \
            --output "$RUNNER_TEMP/cpc-hosted-report"

      - name: Retain the report and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpc-hosted-report
          if-no-files-found: error
          retention-days: 14
